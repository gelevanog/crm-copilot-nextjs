stages:
  - lint
  - test
  - build

variables:
  NEXT_TELEMETRY_DISABLED: '1'
  PNPM_STORE_DIR: .pnpm-store

default:
  image: node:22-bookworm-slim
  cache:
    key:
      files: [pnpm-lock.yaml]
    paths: [.pnpm-store]
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends openssl > /dev/null
    - corepack enable
    - pnpm config set store-dir "$PNPM_STORE_DIR"
    - pnpm install --frozen-lockfile

lint:
  stage: lint
  script:
    - pnpm lint
    - pnpm format:check
    - pnpm typecheck

test:
  stage: test
  services:
    - name: postgres:17-alpine
      alias: postgres
  variables:
    POSTGRES_USER: crm
    POSTGRES_PASSWORD: crm
    POSTGRES_DB: crm_test
    TEST_DATABASE_URL: postgresql://crm:crm@postgres:5432/crm_test?schema=public
  script:
    - pnpm test

build:
  stage: build
  script:
    - pnpm build

docker-images:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: '/certs'
  cache: []
  before_script: []
  script:
    - docker build -f apps/api/Dockerfile -t crm-copilot-api:$CI_COMMIT_SHORT_SHA .
    - docker build -f apps/web/Dockerfile -t crm-copilot-web:$CI_COMMIT_SHORT_SHA .
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
